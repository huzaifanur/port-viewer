[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "port-viewer"
version = "1.0.0"
description = "A minimal GTK utility for viewing occupied ports"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Huzaifa Nur"}]
readme = "README.md"
keywords = ["linux", "ports", "network", "gtk", "process-monitor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/huzaifanur/port-viewer"
Repository = "https://github.com/huzaifanur/port-viewer.git"
Issues = "https://github.com/huzaifanur/port-viewer/issues"

[project.scripts]
port-viewer = "port_viewer.app:main"

[tool.setuptools]
packages = ["port_viewer"]
include-package-data = true

[tool.setuptools.package-data]
port_viewer = ["style.css", "icons/*.svg"]
